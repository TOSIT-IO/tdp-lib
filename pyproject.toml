[project]
name = "tdp-lib"
version = "2.0.0"
description = "TDP library for TDP Manager"
authors = [{ name = "TOSIT" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ansible-core==2.16.15",
    "networkx==3.6.1",
    "PyYAML==6.0.3",
    "GitPython==3.1.46",
    "SQLAlchemy==2.0.46",
    "click==8.3.1",
    "tabulate==0.9.0", # Python 3.12 suported by 0.10.0 but not released yet (Not maintained) 
    "python-dotenv==1.2.0",
    "jsonschema==4.26.0",
    "pydantic==2.12.5",
    "alembic==1.18.1",
]

[project.optional-dependencies]
visualization = [
    "matplotlib==3.10.8",
    "pydot==4.0.1",
]
postgresql = ["psycopg2-binary==2.9.11", "alembic-postgresql-enum==1.8.0"]
mysql = ["pymysql==1.1.2"]

[project.scripts]
tdp = "tdp.cli.__main__:cli"

[project.urls]
Homepage = "https://github.com/TOSIT-IO/tdp-lib"
Repository = "https://github.com/TOSIT-IO/tdp-lib"
Documentation = "https://github.com/TOSIT-IO/tdp-lib"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.14.14,<1",
    "pytest-xdist>=3.8.0,<4",
    "python-lorem>=1.3.0.post3,<2", # Not maintained
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdp"]

[tool.ruff.lint]
preview = true
select = ["F", "W", "I", "CPY"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "\\A# Copyright \\d{4} TOSIT\\.IO\r?\n# SPDX-License-Identifier: Apache-2\\.0"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
