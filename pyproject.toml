[project]
name = "tdp-lib"
version = "2.0.0"
description = "TDP library for TDP Manager"
authors = [{ name = "TOSIT" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9.0,!=3.9.7,<4.0"
dependencies = [
    "ansible-core==2.15.13",
    "networkx==2.5.1",
    "PyYAML==6.0.3",
    "GitPython==3.1.46",
    "SQLAlchemy==2.0.45",
    "click==8.0.4",
    "tabulate==0.8.10",
    "python-dotenv==0.20.0",
    "jsonschema==4.10.3",
    "pydantic==2.6.4",
    "alembic==1.13.3",
    "alembic-postgresql-enum==1.2.0",
    "exceptiongroup==1.3.1",
]

[project.optional-dependencies]
visualization = [
    "matplotlib==3.3.4",
    "pydot==1.4.2",
    # numpy is not a direct dependency of tdp-lib
    # we need to fix its version because networkx < 3.3 is not compatible with numpy 2.0
    # numpy is an optional dependency of networkx but is installed by matplotlib
    "numpy<2.0.0",
]
postgresql = ["psycopg2-binary==2.9.11"]
mysql = ["pymysql==1.1.2"]

[project.scripts]
tdp = "tdp.cli.__main__:cli"

[project.urls]
Homepage = "https://github.com/TOSIT-IO/tdp-lib"
Repository = "https://github.com/TOSIT-IO/tdp-lib"
Documentation = "https://github.com/TOSIT-IO/tdp-lib"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "ruff>=0.11.12,<1",
    "pytest-xdist>=3.5.0,<4",
    "python-lorem>=1.3.0.post1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdp"]

[tool.ruff.lint]
preview = true
select = ["F", "W", "I", "CPY"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "\\A# Copyright \\d{4} TOSIT\\.IO\r?\n# SPDX-License-Identifier: Apache-2\\.0"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
